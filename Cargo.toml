[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/focusite-core",
    "crates/focusite-auth",
    "crates/focusite-cas",
    "crates/focusite-download",
    "crates/focusite-diagnostic",
    "crates/focusite-p2p",
    "crates/focusite-modpacks",
]

[workspace.package]
version = "26.1.0"
authors = ["Focusite Contributors"]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
thiserror = "2.0"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha1 = "0.10"
sha2 = "0.10"
uuid = { version = "1.8", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
