[package]
name = "focusite-launcher"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Modern, high-performance, clean-room Minecraft launcher"

[lib]
name = "focusite_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
dotenvy.workspace = true
reqwest.workspace = true

# Internal workspace crates
focusite-core = { path = "../crates/focusite-core" }
focusite-auth = { path = "../crates/focusite-auth" }
focusite-cas = { path = "../crates/focusite-cas" }
focusite-download = { path = "../crates/focusite-download" }
focusite-diagnostic = { path = "../crates/focusite-diagnostic" }
focusite-p2p = { path = "../crates/focusite-p2p" }
focusite-modpacks = { path = "../crates/focusite-modpacks" }
