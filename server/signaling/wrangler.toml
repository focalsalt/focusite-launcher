name = "focusite-signaling"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Reachable only through the custom domain below.
workers_dev = false
preview_urls = false
routes = [{ pattern = "focusite-p2p.focalsalt.net", custom_domain = true }]

[[durable_objects.bindings]]
name = "GROUP"
class_name = "GroupRoom"

# SQLite-backed Durable Objects are available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GroupRoom"]

# Per-IP limits applied inside the Worker (dashboard rate limiting rules are not on the free plan).
[[ratelimits]]
name = "CONNECT_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "1002"
simple = { limit = 3, period = 60 }
